services:
    backend:
        build:
            context: ./backend
            dockerfile: Dockerfile.dev
        volumes:
            - ./backend/app:/app/app
            - ./backend/app/storage/data:/data
            - ./backend/app/storage/data/tmp:/app/storage
            - app-locks:/app/locks
        ports:
            - "8000:8000"
        environment:
            - POSTGRES_PASSWORD=${METADATA_BROWSER_POSTGRES_PASSWORD:-admin}
            - POSTGRES_USER=${METADATA_BROWSER_POSTGRES_USER:-admin}
            - POSTGRES_DB=${METADATA_BROWSER_POSTGRES_DB:-universal_metadata_browser}
        restart: unless-stopped
        networks:
            - app-network
        env_file:
            - .env
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy

    worker:
        build:
            context: ./backend
            dockerfile: Dockerfile.dev
        command: ["python", "-m", "app.workers.JobWorker"]
        volumes:
            - ./backend/app:/app/app
        environment:
            - METADATA_BROWSER_POSTGRES_HOST=postgres
            - METADATA_BROWSER_POSTGRES_PORT=5432
            - METADATA_BROWSER_REDIS_URL=redis://redis:6379/0
        restart: unless-stopped
        networks:
            - app-network
        env_file:
            - .env
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy

    frontend:
        build:
            context: ./frontend
            dockerfile: Dockerfile.dev
        volumes:
            - ./frontend:/app
            - /app/node_modules
        ports:
            - "3000:3000"
        environment:
            - HOST=${METADATA_BROWSER_FRONTEND_HOST:-0.0.0.0}
        restart: unless-stopped
        networks:
            - app-network
        env_file:
            - .envfile
        depends_on:
            - backend

    postgres:
        image: postgres:17-alpine3.22
        volumes:
            - ./dev-database:/var/lib/postgresql/data
        ports:
            - "5432:5432"
        environment:
            - POSTGRES_PASSWORD=${METADATA_BROWSER_POSTGRES_PASSWORD:-admin}
            - POSTGRES_USER=${METADATA_BROWSER_POSTGRES_USER:-admin}
            - POSTGRES_DB=${METADATA_BROWSER_POSTGRES_DB:-postgres}
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
            interval: 5s
            timeout: 5s
            retries: 10
        restart: unless-stopped
        networks:
            - app-network
        env_file:
            - .env

    redis:
        image: redis:7-alpine
        command: ["redis-server", "--appendonly", "yes"]
        volumes:
            - redis-data:/data
        ports:
            - "6379:6379"
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 5s
            timeout: 3s
            retries: 10
        restart: unless-stopped
        networks:
            - app-network

networks:
    app-network:
        driver: bridge

volumes:
    app-locks:
        driver: local
    dev-database:
        driver: local
    redis-data:
        driver: local
